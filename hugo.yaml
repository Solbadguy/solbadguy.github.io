baseURL: "https://solbadguy.github.io/"
locale: "ru"
defaultContentLanguage: "ru"
title: "admin46@blog:~$"
theme: "terminal"
paginate: 10

enableEmoji: true
enableRobotsTXT: true
pygmentsCodeFences: true
pygmentsUseClasses: true

params:
  env: "production"                 # включает SEO-режим
  disableAnalytics: true            # отключает google_analytics.html
  author: "admin46"
  description: "Заметки из /var/log жизни Linux-инженера"
  hostname: "blog"
  username: "engineer"
  prompt: "~$"
  # SEO
  keywords: ["блог", "linux", "it", "администрирование", "devops"]
  description: "Личный блог admin46 — заметки по Linux, DevOps, сетям и инфраструктуре."
  # OpenGraph / Twitter
  images: ["images/og-image.png"]

menu:
  main:
    - name: "~/posts"
      url: /posts/
      weight: 1
    - name: "~/archive"
      url: /archive/
      weight: 2
    - name: "~/uses"
      url: /uses/
      weight: 3
    - name: "~/now"
      url: /now/
      weight: 4
    - name: "~/obo-mne"
      url: /obo-mne/
      weight: 5
    - name: "~/changelog"
      url: /changelog/
      weight: 6

outputs:
  home:
    - HTML
    - JSON

outputFormats:
  JSON:
    mediaType: application/json
    baseName: index
    isPlainText: true
    notAlternative: true
