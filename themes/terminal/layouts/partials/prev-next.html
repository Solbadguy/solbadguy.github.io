{{ $pages := where .Site.RegularPages "Section" "posts" }}
{{ $prev := $pages.Prev . }}
{{ $next := $pages.Next . }}
{{ if or $prev $next }}
<nav class="prev-next">
  {{ if $prev }}
    <a href="{{ $prev.Permalink }}">
      <div class="label">← Предыдущий</div>
      <div class="title">{{ $prev.Title }}</div>
    </a>
  {{ else }}
    <div></div>
  {{ end }}
  {{ if $next }}
    <a href="{{ $next.Permalink }}" style="text-align: right;">
      <div class="label">Следующий →</div>
      <div class="title">{{ $next.Title }}</div>
    </a>
  {{ else }}
    <div></div>
  {{ end }}
</nav>
{{ end }}
