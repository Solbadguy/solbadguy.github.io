<aside class="sidebar">
  <a href="/" class="sidebar-gif" title="На главную (cd /)">
    <img src="/ragnar.gif" alt="blog logo">
  </a>

  <div class="manifest">
    <div class="manifest-header">whoami</div>
    <div class="manifest-body" id="typewriter-output"
         data-lines='[
           {"text":"$ whoami","delay":100},
           {"text":"admin46","delay":200},
           {"text":"","delay":100},
           {"text":"Собираю метрики,","delay":150},
           {"text":"Строю дашборды.","delay":150},
           {"text":"Глушу ложные тревоги.","delay":150},
           {"text":"Держу руку на пульсе прода.","delay":150}
         ]'
         data-speed="40">
    </div>
  </div>

  <nav>
    <ul class="sidebar-menu">
      {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>

  <div class="sidebar-status">
    <div class="row"><span>posts</span><span class="value">{{ len (where .Site.RegularPages "Section" "posts") }}</span></div>
    <div class="row"><span>tags</span><span class="value">{{ len .Site.Taxonomies.tags }}</span></div>
    <div class="row"><span>uptime</span><span class="value" id="uptime-counter">0s</span></div>
    <div class="row"><span>theme</span><span class="value">monochrome</span></div>
  </div>
</aside>
