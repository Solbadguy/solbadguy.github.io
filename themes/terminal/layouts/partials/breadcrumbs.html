<nav class="breadcrumbs">
  {{/* Путь берём из URL страницы: у page bundles имя файла всегда index.md */}}
  {{ $path := "~/" }}
  {{ if not .IsHome }}
    {{ $path = printf "~/%s" (strings.TrimSuffix "/" (strings.TrimPrefix "/" .RelPermalink)) }}
  {{ end }}

  <span class="prompt">$</span> <span class="command">cat</span> <span class="path">{{ $path }}</span>
</nav>
