{{ define "main" }}
  {{ partial "breadcrumbs.html" . }}
  <article>
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      <p class="post-subtitle">$ cat ~/.config/my-tools</p>
    </header>
    
    <div class="uses-config">
      {{ .Content }}
    </div>
  </article>
{{ end }}
