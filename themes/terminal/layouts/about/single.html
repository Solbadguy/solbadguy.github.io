{{ define "main" }}
  {{ partial "breadcrumbs.html" . }}
  <article>
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
    </header>

    <!-- Сетка: слева фото и текст под ним, справа стек -->
    <div class="about-side-by-side">

      <!-- Левая колонка: фото + описание под ним -->
      <div class="about-main-col">
        <div class="about-photo-col">
          <img src="/obo-mne/images/about-author.jpg" alt="solbadguy">
        </div>
        <div class="about-text-below">
          {{ .Content }}
        </div>
      </div>

      <!-- Правая колонка: Tech Stack (компактный) -->
      <aside class="about-stack-col">
        <div class="stack-container">
          <div class="terminal-header">
            <span>tech_stack.toml</span>
          </div>
          <div class="stack-list">
            
            <div class="stack-group">
              <h4>OS & Core</h4>
              <div class="tags">
                <span class="tag">Fedora</span>
                <span class="tag">Debian</span>
                <span class="tag">Bash</span>
              </div>
            </div>

            <div class="stack-group">
              <h4>Containers</h4>
              <div class="tags">
                <span class="tag">Docker</span>
                <span class="tag">LXC</span>
                <span class="tag">Podman</span>
              </div>
            </div>

            <div class="stack-group">
              <h4>CI/CD & IaC</h4>
              <div class="tags">
                <span class="tag">GitLab CI</span>
                <span class="tag">Ansible</span>
                <span class="tag">Terraform</span>
              </div>
            </div>

            <div class="stack-group">
              <h4>Observability</h4>
              <div class="tags">
                <span class="tag">Zabbix</span>
                <span class="tag">Prometheus</span>
                <span class="tag">Grafana</span>
              </div>
            </div>

            <div class="stack-group">
              <h4>Network</h4>
              <div class="tags">
                <span class="tag">Nginx</span>
                <span class="tag">HAProxy</span>
                <span class="tag">WireGuard</span>
              </div>
            </div>

          </div>
        </div>
      </aside>

    </div>

  </article>
{{ end }}
