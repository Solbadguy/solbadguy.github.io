{{ define "main" }}
  {{ partial "breadcrumbs.html" . }}
  <div class="terminal">
    <div class="terminal-header">ls -la {{ .RelPermalink }}</div>
    <div class="terminal-body">
      <h1 style="font-family: var(--font-mono); margin-bottom: 1.5rem; color: var(--fg);">
        <span style="color: var(--fg-subtle);">$ </span>{{ .Title }}
      </h1>
      {{ with .Content }}<div style="margin-bottom: 1.5rem; color: var(--fg-muted);">{{ . }}</div>{{ end }}
      <ul class="post-list">
        {{ range .Pages }}
          <li class="post-item">
            <span class="post-item-date">{{ .Date.Format "2 января 2006" }}</span>
            <a href="{{ .Permalink }}" class="post-item-title">{{ .Title }}</a>
          </li>
        {{ end }}
      </ul>
    </div>
  </div>
{{ end }}
