{{ define "main" }}
  <div class="terminal">
    <div class="terminal-header">ls -la ~/posts</div>
    <div class="terminal-body">
      <ul class="post-list">
        {{ range first 15 (where .Site.RegularPages "Section" "posts") }}
          <li class="post-item">
            <span class="post-item-date">{{ .Date.Format "2 января 2006" }}</span>
            <a href="{{ .Permalink }}" class="post-item-title">{{ .Title }}</a>
          </li>
        {{ else }}
          <li class="post-item">
            <span class="post-item-date">пусто</span>
            <span class="post-item-title">hugo new posts/first.md</span>
          </li>
        {{ end }}
      </ul>
    </div>
  </div>
{{ end }}
